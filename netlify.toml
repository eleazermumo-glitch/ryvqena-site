[build]
  command = "npm install --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The enquiry form, admin page and AI assistant need the Node server in /backend.
# Netlify cannot run it, so host the server elsewhere (for example on Render) and
# remove the leading "#" from the block below, replacing the address with yours.
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-SERVER-ADDRESS/api/:splat"
#   status = 200
#   force = true
#
# [[redirects]]
#   from = "/admin"
#   to = "https://YOUR-SERVER-ADDRESS/admin"
#   status = 200
